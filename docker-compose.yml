services:
  db:
    image: postgres:15
    container_name: da_db
    environment:
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: productaggregator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: da_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  discountaggregator.bot:
    image: ${DOCKER_REGISTRY-}discountaggregatorbot
    build:
      context: .
      dockerfile: DiscountAggregator.Bot/Dockerfile
    depends_on:
      - db
      - redis
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=productaggregator;Username=postgres;Password=${DB_PASSWORD}
      - Redis__Configuration=redis:6379,password=${REDIS_PASSWORD}
      - TelegramBot__Token=${TELEGRAM_BOT_TOKEN}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - ./logs:/app/logs

volumes:
  pgdata:
  redisdata:
